# Watchlist consumed at startup by the ATS clients (Section 6).
# relocation: COMPANY_WIDE short-circuits the visa gate for that company's postings.
#   Only set where visa sponsorship + relocation is standard on effectively every eng
#   posting. NOTE: on multi-region boards (Adyen, HelloFresh, Wolt, IMC) this bypasses
#   the visa gate only -- the location scorer still has to down-rank non-EU offices.
# priority: HIGH adds +1 to the score.
#
# 2026-08-07: Japan market removed (PayPay, PayPay Card, PayPay Securities, HENNGE).
# Europe-only watchlist, biased toward Java/Go with Kotlin/Scala/Python as acceptable.
# Every enabled greenhouse/personio token below returned HTTP 200 from the public
# boards API on 2026-08-07. Anything unverifiable is parked at the bottom.

companies:

  # ---------------- Netherlands -- HSM visa, IND-recognised sponsors ----------------
  - { name: Picnic,       ats: custom-html, url: "https://jobs.picnic.app/en/vacancies", relocation: COMPANY_WIDE, priority: HIGH }  # Java/Spring backend; active interview pipeline
  - { name: Adyen,        ats: greenhouse,  token: adyen,        relocation: COMPANY_WIDE, priority: HIGH }  # Java at scale + "Infrastructure Developer (Go)" reqs live; Amsterdam is largest office; relocation standard
  - { name: IMC Trading,  ats: greenhouse,  token: imc,          relocation: COMPANY_WIDE }                  # "Java Software Engineer" in Amsterdam; low-latency, high bar, excellent relocation package
  - { name: Catawiki,     ats: greenhouse,  token: catawiki }                                                # Ruby-heavy, occasional plain "Backend Engineer" reqs; IND-recognised sponsor

  # ---------------- Germany -- EU Blue Card ----------------
  - { name: N26,          ats: greenhouse,  token: n26,          relocation: COMPANY_WIDE, priority: HIGH }  # Kotlin/Java fintech; 13 backend reqs at check (Berlin/Barcelona); mid-level friendly
  - { name: HelloFresh,   ats: greenhouse,  token: hellofresh,   relocation: COMPANY_WIDE, priority: HIGH }  # "Senior Backend Engineer - Go and/or JVM" style reqs; board includes non-EU offices -- location scoring matters
  - { name: SumUp,        ats: greenhouse,  token: sumup }                                                   # Go + JVM backend (Berlin/Barcelona/Sofia); sponsorship varies by office -- keep visa gate on
  - { name: GetYourGuide, ats: greenhouse,  token: getyourguide, relocation: COMPANY_WIDE }                  # Berlin; visa + relocation support on postings; snapshot skews senior -- watch for mid-level
  - { name: Celonis,      ats: greenhouse,  token: celonis }                                                 # Java in Munich, SWE-to-Staff ladder; mostly senior reqs
  - { name: Flix,         ats: greenhouse,  token: flix }                                                    # Kotlin-leaning JVM (Berlin/Munich); board carries freelance noise
  - { name: Raisin,       ats: greenhouse,  token: raisin }                                                  # Java/Spring fintech (Berlin); no open backend reqs at check -- cheap to keep polling
  - { name: Solaris,      ats: greenhouse,  token: solarisbank }                                             # Java/Go BaaS (Berlin/Frankfurt); zero eng reqs at check post-restructuring -- low noise
  - { name: Verimi,       ats: personio,    token: verimi }                                                  # Java/Spring, mostly senior/architect -> down-ranked, still tracked

  # ---------------- Austria -- RWR card ----------------
  - { name: Bitpanda,     ats: greenhouse,  token: bitpanda,     priority: HIGH }                            # Vienna; non-senior "Software Engineer, Java" and "Software Engineer, Golang" reqs live at check; visa support advertised per posting
  # 2026-10-09: journi-gmbh.jobs.personio.de now 404s on every path (feed and board), so the Personio account is gone or renamed.
  # Re-enable once the new board is found (run with --app.detect-ats=<careers URL>).
  # - { name: Journi,       ats: personio,    token: journi-gmbh }                                             # Vienna JVM backend; 2026 loop closed at the seniority bar -- keep warm, act on mid-level reqs

  # ---------------- Baltics / Nordics ----------------
  - { name: Wolt,         ats: greenhouse,  token: wolt,         relocation: COMPANY_WIDE, priority: HIGH }  # Kotlin/Go/Scala/Python backend; Helsinki/Berlin relocation package is standard
  - { name: Veriff,       ats: greenhouse,  token: veriff }                                                  # Tallinn HQ; small board (10 reqs at check); referral channel available

