<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobRadar</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --panel: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e2e5ea;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --strong: #15803d;
    --match: #b45309;
    --partial: #6b7280;
    --row-hover: #f0f4ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2026;
      --text: #e6e8eb;
      --muted: #9aa1ab;
      --border: #2c3038;
      --accent: #3b82f6;
      --accent-text: #0b1120;
      --strong: #4ade80;
      --match: #fbbf24;
      --partial: #9aa1ab;
      --row-hover: #232733;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.5rem;
  }
  h1 { font-size: 1.4rem; margin: 0 0 0.25rem; }
  .subtitle { color: var(--muted); margin: 0 0 1rem; font-size: 0.85rem; }
  .layout > * { min-width: 0; }
  .layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1rem;
    max-width: 1200px;
    margin: 0 auto;
  }
  @media (max-width: 600px) {
    body { padding: 1rem; }
    input[type=search] { min-width: 0; width: 100%; }
    .field:has(#filter-search) { flex: 1 1 100%; }
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
  }
  .banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem 1.5rem;
    grid-column: 1 / -1;
  }
  .banner .stats { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; color: var(--muted); font-size: 0.85rem; }
  .banner .stats b { color: var(--text); }
  .spacer { flex: 1; }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    border-radius: 6px;
    padding: 0.5rem 1rem;
  }
  button:disabled { opacity: 0.6; cursor: progress; }
  button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
  .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end; margin-bottom: 1rem; }
  .field { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
  .filters.secondary-filters { margin-top: -0.25rem; }
  .check { flex-direction: row; align-items: center; gap: 0.35rem; color: var(--text); padding-bottom: 0.45rem; }
  .result-count { color: var(--muted); font-size: 0.8rem; margin: 0 0 0.5rem; }
  .table-wrap { overflow-x: auto; }
  .nowrap { white-space: nowrap; }
  .muted { color: var(--muted); }
  .sub { color: var(--muted); font-size: 0.75rem; margin-top: 0.15rem; }
  .flag.new { color: var(--accent-text); background: var(--strong); border-color: var(--strong); }
  input[type=search] { min-width: 14rem; }
  select, input[type=number], input[type=search] {
    font: inherit;
    padding: 0.4rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th, td { text-align: left; padding: 0.5rem 0.6rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th:hover { color: var(--text); }
  th .arrow { font-size: 0.7rem; opacity: 0.6; }
  tr:hover td { background: var(--row-hover); }
  .badge {
    display: inline-block;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    color: #fff;
  }
  .badge.STRONG { background: var(--strong); }
  .badge.MATCH { background: var(--match); }
  .badge.PARTIAL { background: var(--partial); }
  .flag { display: inline-block; margin-right: 0.3rem; padding: 0.05rem 0.35rem; border-radius: 4px; font-size: 0.7rem; border: 1px solid var(--border); color: var(--muted); }
  .flag.on { color: var(--accent-text); background: var(--accent); border-color: var(--accent); }
  a.job-link { color: var(--accent); text-decoration: none; }
  a.job-link:hover { text-decoration: underline; }
  .empty, .loading, .error { color: var(--muted); padding: 1rem 0; font-size: 0.85rem; }
  .error { color: #dc2626; }
  .companies-table td, .companies-table th { font-size: 0.8rem; }
  h2 { font-size: 1rem; margin: 0 0 0.75rem; }
</style>
</head>
<body>

<h1>JobRadar</h1>
<p class="subtitle">Multi-source relocation job aggregator &mdash; matches, sources and manual runs.</p>

<div class="layout">

  <div class="panel banner" id="run-banner">
    <div>
      <strong>Last run:</strong> <span id="last-run-summary">loading&hellip;</span>
    </div>
    <div class="stats" id="last-run-stats"></div>
    <div class="spacer"></div>
    <button id="run-now-btn" type="button">Run now</button>
  </div>

  <div class="panel" id="matches-panel">
    <h2>Matches</h2>
    <div class="filters">
      <div class="field">
        <label for="filter-search">Search</label>
        <input type="search" id="filter-search" placeholder="Title, company, location, tag">
      </div>
      <div class="field">
        <label for="filter-collected">Collected</label>
        <select id="filter-collected">
          <option value="">Any time</option>
          <option value="new">Since my last visit</option>
          <option value="24">Last 24 hours</option>
          <option value="72">Last 3 days</option>
          <option value="168">Last 7 days</option>
          <option value="720">Last 30 days</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-source">Source</label>
        <select id="filter-source"><option value="">All sources</option></select>
      </div>
      <div class="field">
        <label for="filter-country">Country</label>
        <select id="filter-country"><option value="">All countries</option></select>
      </div>
      <div class="field">
        <label for="sort-select">Sort by</label>
        <select id="sort-select">
          <option value="collected:desc">Newest collected</option>
          <option value="collected:asc">Oldest collected</option>
          <option value="posted:desc">Newest posted</option>
          <option value="score:desc">Highest score</option>
          <option value="strength:desc">Strongest match</option>
          <option value="title:asc">Title A&ndash;Z</option>
          <option value="company:asc">Company A&ndash;Z</option>
          <option value="source:asc">Source A&ndash;Z</option>
          <option value="location:asc">Location A&ndash;Z</option>
        </select>
      </div>
    </div>
    <div class="filters secondary-filters">
      <div class="field">
        <label for="filter-strength">Strength</label>
        <select id="filter-strength">
          <option value="">Any</option>
          <option value="STRONG">Strong</option>
          <option value="MATCH">Match</option>
          <option value="PARTIAL">Partial</option>
        </select>
      </div>
      <div class="field">
        <label for="filter-min-score">Min score</label>
        <input type="number" id="filter-min-score" step="0.5" placeholder="e.g. 4">
      </div>
      <div class="field">
        <label for="filter-status">Status</label>
        <select id="filter-status">
          <option value="">Any</option>
          <option value="ACTIVE">Active</option>
          <option value="REMOVED">Removed</option>
        </select>
      </div>
      <label class="field check"><input type="checkbox" id="filter-visa"> Visa</label>
      <label class="field check"><input type="checkbox" id="filter-java"> Java</label>
      <label class="field check"><input type="checkbox" id="filter-go"> Go</label>
      <button id="clear-filters-btn" type="button" class="secondary">Clear</button>
    </div>
    <p class="result-count" id="result-count"></p>
    <div id="matches-container">
      <div class="loading">Loading matches&hellip;</div>
    </div>
  </div>

  <div class="panel" id="companies-panel">
    <h2>Sources</h2>
    <div id="companies-container">
      <div class="loading">Loading sources&hellip;</div>
    </div>
  </div>

</div>

<script>
(function () {
  'use strict';

  var STORAGE_KEY = 'jobradar.matches.view';
  var VISIT_KEY = 'jobradar.lastVisit';
  var STRENGTH_RANK = { STRONG: 3, MATCH: 2, PARTIAL: 1 };

  var state = {
    matches: [],
    loaded: false,
    // When this browser last opened the page; jobs collected after it get a "new" badge.
    previousVisit: null,
    sortKey: 'collected',
    sortDir: 'desc',
  };

  // Every sort key and its direction on first use. Posted and source have no column of
  // their own (they're the muted second lines), so they're reachable from "Sort by".
  var SORT_DEFAULT_DIR = {
    collected: 'desc', posted: 'desc', strength: 'desc', score: 'desc',
    title: 'asc', company: 'asc', source: 'asc', location: 'asc', salaryRaw: 'asc'
  };

  // sortable: false = header not clickable.
  var columns = [
    { key: 'collected', label: 'Collected' },
    { key: 'strength', label: 'Strength' },
    { key: 'score', label: 'Score' },
    { key: 'title', label: 'Title' },
    { key: 'company', label: 'Company' },
    { key: 'location', label: 'Location' },
    { key: 'stack', label: 'Java/Go', sortable: false },
    { key: 'salaryRaw', label: 'Salary' },
    { key: 'link', label: 'Link', sortable: false }
  ];

  // Client-side filters re-render instantly; server-side ones refetch.
  var clientFilterIds = ['filter-search', 'filter-collected', 'filter-source', 'filter-country',
    'filter-visa', 'filter-java', 'filter-go'];
  var serverFilterIds = ['filter-strength', 'filter-min-score', 'filter-status'];

  function qs(id) { return document.getElementById(id); }

  function escapeHtml(value) {
    if (value === null || value === undefined) return '';
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function fetchJson(url, options) {
    return fetch(url, options).then(function (res) {
      if (!res.ok) {
        return res.text().then(function (body) {
          throw new Error('HTTP ' + res.status + (body ? ': ' + body : ''));
        });
      }
      var contentType = res.headers.get('content-type') || '';
      if (contentType.indexOf('application/json') === -1) return null;
      return res.json();
    });
  }

  // ---- Persisted view (filters + sort); best effort, the page works without it ----

  function fieldValue(el) { return el.type === 'checkbox' ? el.checked : el.value; }

  function saveView() {
    var view = { sortKey: state.sortKey, sortDir: state.sortDir, filters: {} };
    clientFilterIds.concat(serverFilterIds).forEach(function (id) { view.filters[id] = fieldValue(qs(id)); });
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(view)); } catch (e) { /* ignore */ }
  }

  function restoreView() {
    var view = null;
    try { view = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch (e) { view = null; }
    if (!view) return;
    if (view.sortKey && SORT_DEFAULT_DIR[view.sortKey]) {
      state.sortKey = view.sortKey;
      state.sortDir = view.sortDir === 'asc' ? 'asc' : 'desc';
    }
    Object.keys(view.filters || {}).forEach(function (id) {
      var el = qs(id);
      if (!el) return;
      var value = view.filters[id];
      if (el.type === 'checkbox') { el.checked = !!value; return; }
      // Source/country options only exist once data loads; seed the saved one so it sticks.
      if (el.tagName === 'SELECT' && value && !el.querySelector('option[value="' + CSS.escape(value) + '"]')) {
        el.insertAdjacentHTML('beforeend', '<option value="' + escapeHtml(value) + '">' + escapeHtml(value) + '</option>');
      }
      el.value = value;
    });
  }

  // ---- Time formatting ----

  function toMillis(iso) {
    if (!iso) return null;
    var t = Date.parse(iso);
    return isNaN(t) ? null : t;
  }

  function relativeTime(iso) {
    var t = toMillis(iso);
    if (t === null) return '&mdash;';
    var mins = Math.round((Date.now() - t) / 60000);
    if (mins < 1) return 'just now';
    if (mins < 60) return mins + ' min ago';
    var hours = Math.round(mins / 60);
    if (hours < 24) return hours + ' h ago';
    var days = Math.round(hours / 24);
    if (days < 60) return days + ' d ago';
    return new Date(t).toISOString().slice(0, 10);
  }

  function exactTime(iso) {
    var t = toMillis(iso);
    return t === null ? '' : new Date(t).toLocaleString(undefined, { hour12: false });
  }

  // ---- Matches ----

  function hasReason(reasons, needle) {
    if (!reasons) return false;
    return reasons.some(function (r) { return r.toLowerCase().indexOf(needle) !== -1; });
  }

  function isJava(m) { return hasReason(m.reasons, 'java'); }
  // Match engine reason text is "+2 Go present"; a bare "go" substring also hits unrelated reasons.
  function isGo(m) { return hasReason(m.reasons, 'go present'); }

  function isNew(m) {
    var seen = toMillis(m.firstSeen);
    return state.previousVisit !== null && seen !== null && seen > state.previousVisit;
  }

  function recordVisit() {
    try {
      var prev = Number(localStorage.getItem(VISIT_KEY));
      state.previousVisit = prev > 0 ? prev : null;
      localStorage.setItem(VISIT_KEY, String(Date.now()));
    } catch (e) { state.previousVisit = null; }
  }

  function loadMatches() {
    var container = qs('matches-container');
    container.innerHTML = '<div class="loading">Loading matches&hellip;</div>';

    var params = new URLSearchParams();
    var strength = qs('filter-strength').value;
    var minScore = qs('filter-min-score').value;
    var status = qs('filter-status').value;
    if (strength) params.set('strength', strength);
    if (minScore) params.set('minScore', minScore);
    if (status) params.set('status', status);

    var url = '/api/matches' + (params.toString() ? '?' + params.toString() : '');

    fetchJson(url)
      .then(function (data) {
        state.matches = data || [];
        state.loaded = true;
        populateOptions();
        renderMatches();
      })
      .catch(function (err) {
        container.innerHTML = '<div class="error">Failed to load matches: ' + escapeHtml(err.message) + '</div>';
      });
  }

  // Rebuilds a <select> from the loaded data, with per-value counts, keeping the selection.
  function fillSelect(id, allLabel, valueOf) {
    var el = qs(id);
    var current = el.value;
    var counts = {};
    state.matches.forEach(function (m) {
      var v = valueOf(m);
      if (v) counts[v] = (counts[v] || 0) + 1;
    });
    var values = Object.keys(counts).sort();
    if (current && values.indexOf(current) === -1) values.unshift(current);
    el.innerHTML = '<option value="">' + allLabel + '</option>' + values.map(function (v) {
      return '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + ' (' + (counts[v] || 0) + ')</option>';
    }).join('');
    el.value = current;
  }

  function populateOptions() {
    fillSelect('filter-source', 'All sources', function (m) { return m.source; });
    fillSelect('filter-country', 'All countries', function (m) { return m.country; });
  }

  function filteredMatches() {
    var search = qs('filter-search').value.trim().toLowerCase();
    var collected = qs('filter-collected').value;
    var source = qs('filter-source').value;
    var country = qs('filter-country').value;
    var visa = qs('filter-visa').checked;
    var java = qs('filter-java').checked;
    var go = qs('filter-go').checked;
    var cutoff = collected && collected !== 'new' ? Date.now() - Number(collected) * 3600000 : null;
    var terms = search ? search.split(/\s+/) : [];

    return state.matches.filter(function (m) {
      if (source && m.source !== source) return false;
      if (country && m.country !== country) return false;
      if (visa && !m.visaFlag) return false;
      if (java && !isJava(m)) return false;
      if (go && !isGo(m)) return false;
      if (collected === 'new' && !isNew(m)) return false;
      if (cutoff !== null) {
        var seen = toMillis(m.firstSeen);
        if (seen === null || seen < cutoff) return false;
      }
      if (terms.length) {
        var haystack = [m.title, m.company, m.city, m.country, m.source, m.salaryRaw]
          .concat(m.techTags || []).join(' ').toLowerCase();
        // Every word must appear somewhere, in any order.
        if (!terms.every(function (t) { return haystack.indexOf(t) !== -1; })) return false;
      }
      return true;
    });
  }

  function sortValue(m, key) {
    switch (key) {
      case 'collected': return toMillis(m.firstSeen);
      case 'posted': return toMillis(m.postedAt);
      case 'strength': return STRENGTH_RANK[m.strength] || 0;
      case 'score': return typeof m.score === 'number' ? m.score : null;
      case 'title': return (m.title || '').toLowerCase() || null;
      case 'company': return (m.company || '').toLowerCase() || null;
      case 'location': return [m.country, m.city].filter(Boolean).join(' ').toLowerCase() || null;
      case 'source': return (m.source || '').toLowerCase() || null;
      case 'salaryRaw': return (m.salaryRaw || '').toLowerCase() || null;
      default: return null;
    }
  }

  function sortList(list) {
    var key = state.sortKey;
    var dir = state.sortDir === 'asc' ? 1 : -1;
    return list.slice().sort(function (a, b) {
      var va = sortValue(a, key), vb = sortValue(b, key);
      // Missing values sink to the bottom in either direction.
      if (va === null && vb !== null) return 1;
      if (vb === null && va !== null) return -1;
      if (va !== null && va < vb) return -1 * dir;
      if (va !== null && va > vb) return 1 * dir;
      // Ties: newest collected, then highest score.
      var ca = toMillis(a.firstSeen) || 0, cb = toMillis(b.firstSeen) || 0;
      if (ca !== cb) return cb - ca;
      return (b.score || 0) - (a.score || 0);
    });
  }

  // Shows the current sort in "Sort by"; a header-click combination not in the list
  // (e.g. Score ascending) gets a temporary option so the select never lies.
  function syncSortSelect() {
    var el = qs('sort-select');
    var value = state.sortKey + ':' + state.sortDir;
    var custom = el.querySelector('option[data-custom]');
    if (custom) custom.remove();
    if (!el.querySelector('option[value="' + value + '"]')) {
      var label = (columns.filter(function (c) { return c.key === state.sortKey; })[0] || { label: state.sortKey }).label;
      el.insertAdjacentHTML('beforeend', '<option data-custom value="' + escapeHtml(value) + '">'
        + escapeHtml(label) + (state.sortDir === 'asc' ? ' ascending' : ' descending') + '</option>');
    }
    el.value = value;
  }

  function renderMatches() {
    var container = qs('matches-container');
    var countEl = qs('result-count');
    if (!state.matches.length) {
      countEl.textContent = '';
      container.innerHTML = '<div class="empty">No matches for the current filters.</div>';
      return;
    }

    var visible = sortList(filteredMatches());
    var newCount = state.matches.filter(isNew).length;
    countEl.textContent = 'Showing ' + visible.length + ' of ' + state.matches.length + ' matches'
      + (newCount ? ' · ' + newCount + ' new since your last visit' : '');

    if (!visible.length) {
      container.innerHTML = '<div class="empty">No matches for the current filters.</div>';
      return;
    }

    var rows = visible.map(function (m) {
      var location = [m.city, m.country].filter(Boolean).map(escapeHtml).join(', ') || '&mdash;';
      return '<tr>'
        + '<td class="nowrap"><div title="' + escapeHtml(exactTime(m.firstSeen)) + '">' + relativeTime(m.firstSeen) + '</div>'
        +     (m.postedAt ? '<div class="sub" title="' + escapeHtml(exactTime(m.postedAt)) + '">posted ' + relativeTime(m.postedAt) + '</div>' : '') + '</td>'
        + '<td><span class="badge ' + escapeHtml(m.strength) + '">' + escapeHtml(m.strength) + '</span></td>'
        + '<td>' + (typeof m.score === 'number' ? m.score.toFixed(1) : '') + '</td>'
        + '<td>' + escapeHtml(m.title)
        +     (isNew(m) ? ' <span class="flag new">new</span>' : '')
        +     (m.visaFlag ? ' <span class="flag on">visa</span>' : '')
        +     (m.status === 'REMOVED' ? ' <span class="flag">removed</span>' : '') + '</td>'
        + '<td>' + escapeHtml(m.company) + '<div class="sub">' + escapeHtml(m.source) + '</div></td>'
        + '<td>' + location + '</td>'
        + '<td class="nowrap"><span class="flag ' + (isJava(m) ? 'on' : '') + '">Java</span>'
        +     '<span class="flag ' + (isGo(m) ? 'on' : '') + '">Go</span></td>'
        + '<td>' + (m.salaryRaw ? escapeHtml(m.salaryRaw) : '&mdash;') + '</td>'
        + '<td><a class="job-link" href="' + escapeHtml(m.url) + '" target="_blank" rel="noopener">open</a></td>'
        + '</tr>';
    }).join('');

    var head = columns.map(function (col) {
      if (col.sortable === false) return '<th>' + col.label + '</th>';
      var arrow = '';
      if (state.sortKey === col.key) {
        arrow = ' <span class="arrow">' + (state.sortDir === 'asc' ? '▲' : '▼') + '</span>';
      }
      return '<th data-key="' + col.key + '">' + col.label + arrow + '</th>';
    }).join('');

    container.innerHTML = '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>'
      + rows + '</tbody></table></div>';

    Array.prototype.forEach.call(container.querySelectorAll('th[data-key]'), function (th) {
      th.addEventListener('click', function () {
        var key = th.getAttribute('data-key');
        if (state.sortKey === key) {
          state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
        } else {
          state.sortKey = key;
          state.sortDir = SORT_DEFAULT_DIR[key];
        }
        syncSortSelect();
        saveView();
        renderMatches();
      });
    });
  }

  // ---- Companies / sources ----

  function loadCompanies() {
    var container = qs('companies-container');
    fetchJson('/api/companies')
      .then(function (data) {
        if (!data || !data.length) {
          container.innerHTML = '<div class="empty">No companies configured.</div>';
          return;
        }
        var rows = data.map(function (c) {
          return '<tr>'
            + '<td>' + escapeHtml(c.name) + '</td>'
            + '<td>' + escapeHtml(c.ats) + '</td>'
            + '<td>' + c.activeCount + '</td>'
            + '</tr>';
        }).join('');
        container.innerHTML = '<table class="companies-table"><thead><tr>'
          + '<th>Company</th><th>ATS</th><th>Active</th>'
          + '</tr></thead><tbody>' + rows + '</tbody></table>';
      })
      .catch(function (err) {
        container.innerHTML = '<div class="error">Failed to load sources: ' + escapeHtml(err.message) + '</div>';
      });
  }

  // ---- Last run banner ----

  // stats is per source: { "greenhouse:imc": { fetched, new, updated, removed, errors }, ... }.
  // The banner shows the totals across sources.
  function formatStats(stats) {
    if (!stats) return '';
    var totals = {};
    var order = [];
    Object.keys(stats).forEach(function (source) {
      var s = stats[source];
      if (!s || typeof s !== 'object') return;
      Object.keys(s).forEach(function (k) {
        if (typeof s[k] !== 'number') return;
        if (!(k in totals)) { totals[k] = 0; order.push(k); }
        totals[k] += s[k];
      });
    });
    var preferred = ['fetched', 'new', 'updated', 'removed', 'errors'];
    order.sort(function (a, b) {
      var ia = preferred.indexOf(a), ib = preferred.indexOf(b);
      return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
    });
    return '<span><b>' + Object.keys(stats).length + '</b> sources</span>' + order.map(function (k) {
      return '<span><b>' + totals[k] + '</b> ' + escapeHtml(k) + '</span>';
    }).join('');
  }

  function loadLastRun() {
    var summary = qs('last-run-summary');
    var statsEl = qs('last-run-stats');
    fetchJson('/api/runs?limit=1')
      .then(function (data) {
        if (!data || !data.length) {
          summary.textContent = 'no runs yet';
          statsEl.innerHTML = '';
          return;
        }
        var run = data[0];
        var when = run.finishedAt || run.startedAt;
        summary.textContent = '#' + run.id + ' at ' + (when ? exactTime(when) + ' (' + relativeTime(when) + ')' : 'unknown time');
        statsEl.innerHTML = formatStats(run.stats);
      })
      .catch(function (err) {
        summary.textContent = 'unavailable';
        statsEl.innerHTML = '<span class="error">' + escapeHtml(err.message) + '</span>';
      });
  }

  function refreshAll() {
    loadLastRun();
    loadMatches();
    loadCompanies();
  }

  function runNow() {
    var btn = qs('run-now-btn');
    btn.disabled = true;
    btn.textContent = 'Running…';
    fetchJson('/api/run', { method: 'POST' })
      .then(function () {
        refreshAll();
      })
      .catch(function (err) {
        alert('Ingest run failed: ' + err.message);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Run now';
      });
  }

  qs('run-now-btn').addEventListener('click', runNow);

  var searchTimer = null;
  clientFilterIds.forEach(function (id) {
    var el = qs(id);
    el.addEventListener(id === 'filter-search' ? 'input' : 'change', function () {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { saveView(); renderMatches(); }, id === 'filter-search' ? 150 : 0);
    });
  });
  qs('sort-select').addEventListener('change', function () {
    var parts = qs('sort-select').value.split(':');
    state.sortKey = parts[0];
    state.sortDir = parts[1] === 'asc' ? 'asc' : 'desc';
    syncSortSelect();
    saveView();
    renderMatches();
  });
  serverFilterIds.forEach(function (id) {
    qs(id).addEventListener('change', function () { saveView(); loadMatches(); });
  });
  qs('clear-filters-btn').addEventListener('click', function () {
    clientFilterIds.concat(serverFilterIds).forEach(function (id) {
      var el = qs(id);
      if (el.type === 'checkbox') el.checked = false;
      else el.value = '';
    });
    state.sortKey = 'collected';
    state.sortDir = 'desc';
    syncSortSelect();
    saveView();
    loadMatches();
  });

  recordVisit();
  restoreView();
  syncSortSelect();
  refreshAll();
})();
</script>

</body>
</html>
